<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: admin-control-desk.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7e8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1536px">
  <div class="r-sidebar-brand region text" data-region="sidebar-brand"><!-- Codizzz Admin brand lockup --><p style="font-size:var(--r-sidebar-brand-font);line-height:1.05;margin:0">sidebar-brand</p></div>
  <div class="r-sidebar-nav region control" data-region="sidebar-nav"><!-- Services, Careers and Team resource navigation: rebuild the control's chrome from the crop (comp-spec.mjs --crop sidebar-nav); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-account-bar region control" data-region="account-bar"><!-- Signed-in admin account control: rebuild the control's chrome from the crop (comp-spec.mjs --crop account-bar); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-admin-label region text" data-region="admin-label"><!-- Small Codizzz Admin workspace label --><p style="font-size:var(--r-admin-label-font);line-height:1.05;margin:0">admin-label</p></div>
  <div class="r-lead-title region text" data-region="lead-title"><!-- Large Content Control Desk heading --><p style="font-size:var(--r-lead-title-font);font-family:var(--r-lead-title-family),sans-serif;font-weight:var(--r-lead-title-weight);line-height:1.05;margin:0">lead-title</p></div>
  <div class="r-lead-description region text" data-region="lead-description"><!-- Short workspace purpose statement --><p style="font-size:var(--r-lead-description-font);line-height:1.05;margin:0">lead-description</p></div>
  <div class="r-brand-note region text" data-region="brand-note"><!-- Short brand statement with registration rule --><p style="font-size:var(--r-brand-note-font);line-height:1.05;margin:0">brand-note</p></div>
  <div class="r-services-summary region text" data-region="services-summary"><!-- Services resource title and record count --><p style="line-height:1.05;margin:0">services-summary</p></div>
  <div class="r-services-action region control" data-region="services-action"><!-- Add service action: rebuild the control's chrome from the crop (comp-spec.mjs --crop services-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-careers-summary region text" data-region="careers-summary"><!-- Careers resource title and record count --><p style="line-height:1.05;margin:0">careers-summary</p></div>
  <div class="r-careers-action region control" data-region="careers-action"><!-- Add role action: rebuild the control's chrome from the crop (comp-spec.mjs --crop careers-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-team-summary region text" data-region="team-summary"><!-- Team resource title and record count --><p style="line-height:1.05;margin:0">team-summary</p></div>
  <div class="r-team-action region control" data-region="team-action"><!-- Add member action: rebuild the control's chrome from the crop (comp-spec.mjs --crop team-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-recent-title region text" data-region="recent-title"><!-- Recent content section title --><p style="font-size:var(--r-recent-title-font);line-height:1.05;margin:0">recent-title</p></div>
  <div class="r-registry-filters region control" data-region="registry-filters"><!-- Search, type filter and status filter controls: rebuild the control's chrome from the crop (comp-spec.mjs --crop registry-filters); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-registry-head region text" data-region="registry-head"><!-- Content registry column labels --><p style="font-size:var(--r-registry-head-font);line-height:1.05;margin:0">registry-head</p></div>
  <div class="r-registry-rows region text" data-region="registry-rows"><!-- Recent content rows with type, status and updated date --><p style="font-size:var(--r-registry-rows-font);line-height:1.05;margin:0">registry-rows</p></div>
  <div class="r-sidebar-close region text" data-region="sidebar-close"><!-- Codizzz positioning statement --><p style="font-size:var(--r-sidebar-close-font);line-height:1.05;margin:0">sidebar-close</p></div>
  <div class="r-workspace-footer region text" data-region="workspace-footer"><!-- Copyright and closing line --><p style="font-size:var(--r-workspace-footer-font);line-height:1.05;margin:0">workspace-footer</p></div>
</main>
</body>
</html>
